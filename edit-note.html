<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Note - Public Notebook</title><link rel="stylesheet" href="style.css"></head>
<body data-page="edit">
<header class="topbar"><a class="brand" href="index.html">PUBLIC NOTEBOOK</a><div class="topbar-right"><span id="auth-label"></span><a class="small-button" id="auth-button" href="login.html">LOGIN</a></div></header>
<main class="writer-page"><a class="back-link" id="writer-back" href="index.html">← BACK</a>
<section class="writer-card"><div class="writer-head"><div><div class="eyebrow">EDIT NOTE</div><h1 id="writer-topic">Loading...</h1></div></div>
<label class="field-label">TITLE<input id="title" maxlength="120"></label>
<div class="toolbar"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="underline"><u>U</u></button><button type="button" data-command="justifyLeft">L</button><button type="button" data-command="justifyCenter">C</button><button type="button" data-command="justifyRight">R</button></div>
<div id="editor" class="paper" contenteditable="true"></div><div class="writer-footer"><span>Only the topic owner can edit this note.</span><span id="counter">0 / 20000</span></div>
<button id="post-button" class="action-button red wide">SAVE CHANGES</button><p id="write-status" class="form-status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.0/dist/purify.min.js"></script><script src="config.js"></script><script src="app.js"></script>
</body></html>
