<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic - Public Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="topic">
<header class="topbar">
  <button class="icon-button" id="topics-toggle">☰</button>
  <a class="brand" href="index.html">PUBLIC NOTEBOOK</a>
  <div class="topbar-topic">
    <span>CURRENT TOPIC</span>
    <strong id="current-topic-name">GENERAL</strong>
  </div>
  <div class="topbar-right"><span id="auth-label"></span><a class="small-button" id="auth-button" href="login.html">LOGIN</a></div>
</header>
<div class="layout">
  <aside class="sidebar" id="topic-sidebar">
    <div class="panel-heading"><span>TOPICS</span><button class="close-button" id="topics-close">×</button></div>
    <a class="general-link" href="topic.html?id=general">★ GENERAL</a>
    <div class="sidebar-subheading">COMMUNITY TOPICS</div>
    <div id="topic-list" class="topic-list"></div>
    <div class="pagination compact" id="topic-pagination"></div>
    <div id="progress-box" class="progress-box"></div>
  </aside>
  <main class="content-column">
    <section class="topic-heading">
      <div><div class="eyebrow">CURRENT TOPIC</div><div class="topic-label">JOURNAL ENTRIES</div><p id="current-topic-description"></p></div>
      <a class="action-button green" id="write-button" href="#">+ ADD NOTE</a>
    </section>
    <div id="page-status" class="status"></div>
    <section id="note-list" class="note-list"></section>
    <div class="pagination" id="note-pagination"></div>
  </main>
  <aside class="info-panel">
    <div id="owner-panel"></div>
    <hr>
    <div class="info-section"><h3>JOIN COMMUNITY</h3><p>Create an account to collect GENERAL notes and unlock your own topic at 20 notes.</p><a class="action-button blue" id="community-button" href="register.html">JOIN</a></div>
    <hr><div class="info-section"><h3>CONTACT</h3><div id="contact-links">Set your site contact links in Supabase.</div></div>
  </aside>
</div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
