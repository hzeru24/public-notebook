<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write Note - Public Notebook</title><link rel="stylesheet" href="style.css">
</head>
<body data-page="write">
<header class="topbar"><a class="brand" href="index.html">PUBLIC NOTEBOOK</a><div class="topbar-right"><span id="auth-label"></span><a class="small-button" id="auth-button" href="login.html">LOGIN</a></div></header>
<main class="writer-page">
<a class="back-link" id="writer-back" href="index.html">← BACK</a>
<section class="writer-card">
<div class="writer-head"><div><div class="eyebrow">WRITE NOTE</div><h1 id="writer-topic">GENERAL</h1></div></div>
<label class="field-label">TITLE<input id="title" maxlength="120" placeholder="Give your note a title"></label>
<div class="toolbar" aria-label="Text formatting">
<button type="button" data-command="bold" title="Bold"><b>B</b></button>
<button type="button" data-command="italic" title="Italic"><i>I</i></button>
<button type="button" data-command="underline" title="Underline"><u>U</u></button>
<span class="toolbar-divider"></span>
<button type="button" id="sketch-toggle" title="Draw on the note">DRAW</button>
<button type="button" id="sketch-eraser" title="Erase sketch strokes">ERASE</button>
<label class="sketch-color-label" title="Sketch color">COLOR<input id="sketch-color" type="color" value="#2d2924"></label>
<div class="sketch-swatches" aria-label="Quick sketch colors">
<button type="button" class="swatch active" data-sketch-color="#2d2924" style="--swatch:#2d2924" title="Ink"></button>
<button type="button" class="swatch" data-sketch-color="#b85f4d" style="--swatch:#b85f4d" title="Terracotta"></button>
<button type="button" class="swatch" data-sketch-color="#526b56" style="--swatch:#526b56" title="Sage"></button>
<button type="button" class="swatch" data-sketch-color="#3d6ea8" style="--swatch:#3d6ea8" title="Blue"></button>
<button type="button" class="swatch" data-sketch-color="#d19b2a" style="--swatch:#d19b2a" title="Gold"></button>
</div>
<select id="sketch-size" class="sketch-size" title="Brush size"><option value="2">Fine</option><option value="4" selected>Medium</option><option value="7">Thick</option><option value="11">Marker</option></select>
<button type="button" id="sketch-clear" title="Clear sketch">CLEAR</button>
</div>
<div class="editor-help">Press <strong>Enter</strong> for a new paragraph. Use <strong>DRAW</strong> to place a transparent sketch layer over your writing.</div>
<div class="paper-stage">
<div id="editor" class="paper" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write your note here..."></div>
<canvas id="sketch-canvas" class="sketch-canvas" aria-hidden="true"></canvas>
</div>
<div class="writer-footer"><span>Posted publicly under your account.</span><span id="counter">0 / 20000</span></div>
<button id="post-button" class="action-button red wide">POST NOTE</button>
<p id="write-status" class="form-status"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.0/dist/purify.min.js"></script><script src="config.js"></script><script src="app.js"></script>
</body>
</html>
