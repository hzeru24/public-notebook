<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - Public Notebook</title><link rel="stylesheet" href="style.css"></head>
<body data-page="register"><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html">PUBLIC NOTEBOOK</a><div class="eyebrow">JOIN THE COMMUNITY</div><h1>Create account</h1><label class="field-label">USERNAME<input id="username" maxlength="30" autocomplete="username"></label><label class="field-label">EMAIL<input id="email" type="email" autocomplete="email"></label><label class="field-label">PASSWORD<input id="password" type="password" minlength="8" autocomplete="new-password"></label><button id="auth-submit" class="action-button green wide">CREATE ACCOUNT</button><p id="auth-status" class="form-status"></p><p>Already registered? <a href="login.html">Login</a></p><a class="back-link" href="index.html">← BACK TO NOTEBOOK</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
