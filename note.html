<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note - Public Notebook</title><link rel="stylesheet" href="style.css">
</head>
<body data-page="note">
<header class="topbar"><button class="icon-button" id="topics-toggle">☰</button><a class="brand" href="index.html">PUBLIC NOTEBOOK</a><div class="topbar-right"><span id="auth-label"></span><a class="small-button" id="auth-button" href="login.html">LOGIN</a></div></header>
<div class="layout">
  <aside class="sidebar" id="topic-sidebar"><div class="panel-heading"><span>TOPICS</span><button class="close-button" id="topics-close">×</button></div><a class="general-link" href="topic.html?id=general">★ GENERAL</a><div class="sidebar-subheading">COMMUNITY TOPICS</div><div id="topic-list" class="topic-list"></div><div class="pagination compact" id="topic-pagination"></div><div id="progress-box" class="progress-box"></div></aside>
  <main class="content-column single-note-column">
    <a class="back-link" id="back-topic" href="index.html">← BACK TO TOPIC</a>
    <article id="note" class="full-note"><div class="status">Loading note...</div></article>
  </main>
  <aside class="info-panel"><div id="owner-panel"></div><hr><div class="info-section"><h3>COMMUNITY</h3><p>Public notes can be read by everyone. Only topic owners can manage notes in their own topics.</p></div><hr><div class="info-section"><h3>CONTACT</h3><div id="contact-links">Will post contact information soon.</div></div></aside>
</div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</body>
</html>
